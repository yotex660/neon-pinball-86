name: Build NEON PINBALL 86 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract game source
        run: |
          unzip NeonPinball86-source.zip
          ls -la
          ls -la NeonPinball86

      - name: Build APK
        working-directory: NeonPinball86
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-PINBALL-86
          path: NeonPinball86/app/build/outputs/apk/debug/app-debug.apk
